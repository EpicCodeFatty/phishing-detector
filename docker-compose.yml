# Local PostgreSQL and Valkey for development and the integration tests. Nothing else runs
# here: the application itself runs on the host with `flask --app app.web run`.
#
#   docker compose up -d --wait    start both, and wait until they accept connections
#   docker compose down            stop them (the database's data survives in the pgdata volume)
#
# The cache's password comes from .env, which docker compose reads for ${...} below and the
# application reads too. Once per clone:  echo CACHE_PASSWORD=localdev>> .env

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: phishing
      POSTGRES_USER: phishing
      # Local-only password for a container that listens on localhost alone. It is not
      # a leaked credential: it never reaches AWS, where RDS generates the password and
      # keeps it in Secrets Manager.
      POSTGRES_PASSWORD: localdev
    ports:
      # Bound to the loopback interfaces only, so the database is unreachable from the
      # network. Both are needed: "localhost" resolves to ::1 first, and with only the
      # IPv4 binding every connection waited out the 5-second connect timeout on ::1.
      - "127.0.0.1:5432:5432"
      - "[::1]:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phishing -d phishing"]
      interval: 2s
      timeout: 5s
      retries: 15

  # The result cache. Valkey 8.1, the closest open-source release to the 8.2 that ElastiCache
  # runs: there is no 8.2 image. No TLS, so the application runs with CACHE_TLS=false here;
  # on AWS the cache is reached over TLS only. Nothing is persisted: like the real one, it
  # holds nothing that cannot be recomputed.
  cache:
    image: valkey/valkey:8.1
    environment:
      # Local-only, like the database's. Required: compose stops with this message if .env
      # does not set it, rather than starting a cache that accepts anyone.
      CACHE_PASSWORD: ${CACHE_PASSWORD:?set CACHE_PASSWORD in .env (see the comment at the top of docker-compose.yml)}
    # The password is passed through the environment and expanded by the container's shell,
    # so it is not written into this file. $$ is compose's escape for a literal $.
    command: ["sh", "-c", "exec valkey-server --save '' --appendonly no --requirepass \"$$CACHE_PASSWORD\""]
    ports:
      # Loopback only, both addresses, for the same reasons as the database's port.
      - "127.0.0.1:6379:6379"
      - "[::1]:6379:6379"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$CACHE_PASSWORD\" valkey-cli ping | grep -q PONG"]
      interval: 2s
      timeout: 5s
      retries: 15

volumes:
  pgdata:
